server:
  port: 8085

spring:
  application:
    name: collections-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/okcapital_collections}
    username: ${DB_USERNAME:okcapital_app}
    password: ${DB_PASSWORD:okcapital_app}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

app:
  service-name: collections-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

# Production defaults should use secrets and environment variables.
