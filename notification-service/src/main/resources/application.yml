server:
  port: 8080

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/okcapital_notification}
    username: ${DB_USERNAME:okcapital_app}
    password: ${DB_PASSWORD:okcapital_app}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

app:
  service-name: notification-service

# Production defaults should use secrets and environment variables.
