server:
  port: 8083

spring:
  application:
    name: document-service
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:11MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/okcapital_document}
    username: ${DB_USERNAME:okcapital_app}
    password: ${DB_PASSWORD:okcapital_app}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

app:
  service-name: document-service
  documents:
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10MB}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_DOCUMENT_BUCKET:documents}

# Production defaults should use secrets and environment variables.
